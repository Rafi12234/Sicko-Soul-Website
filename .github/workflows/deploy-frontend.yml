name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

concurrency:
  group: sicko-soul-frontend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.sickosoul.shop/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare standalone release
        working-directory: frontend
        run: |
          rm -rf deploy-output
          mkdir -p deploy-output

          cp -R .next/standalone/. deploy-output/

          if [ -d "public" ]; then
            cp -R public deploy-output/public
          fi

          mkdir -p deploy-output/.next
          cp -R .next/static deploy-output/.next/static

      - name: Upload frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: frontend/deploy-output/
          server-dir: release/

      - name: Create restart marker
        run: |
          mkdir -p restart-output
          date -u +"%Y-%m-%dT%H:%M:%SZ" > restart-output/restart.txt

      - name: Restart Passenger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: restart-output/
          server-dir: tmp/