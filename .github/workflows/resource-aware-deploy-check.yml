name: Validate resource-aware deployment script

on:
  push:
    branches:
      - ops/resource-aware-production-deploy
  pull_request:
    branches:
      - main
    paths:
      - deploy/cpanel/**
      - tests/safe-deploy.test.mjs
      - .github/workflows/resource-aware-deploy-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Validate Bash syntax
        run: bash -n deploy/cpanel/deploy-cpanel.sh
      - name: Exercise activation and rollback simulations
        run: node --test tests/safe-deploy.test.mjs tests/sequential-preflight.test.mjs
