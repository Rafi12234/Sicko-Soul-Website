name: Build and Deploy Sicko Soul to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sicko-soul-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_BASE_URL: /api/v1

  CPANEL_HOST: ayah.ihostman.com
  CPANEL_USER: sickosou
  CPANEL_REPOSITORY_ROOT: /home/sickosou/repositories/Sicko-Soul-Website
  CPANEL_RELEASE_BRANCH: cpanel-release

jobs:
  build-release:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ------------------------------------------------------------
      # FRONTEND
      # ------------------------------------------------------------

      - name: Install and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -Eeuo pipefail

          npm config set registry https://registry.npmjs.org/
          npm ci --include=dev --no-audit --no-fund

          npm run typecheck
          npm run build

          test -f .next/standalone/server.js
          test -d .next/static

      - name: Prepare frontend release archive
        working-directory: frontend
        run: |
          set -Eeuo pipefail

          rm -rf deploy-release
          mkdir -p deploy-release

          cp -a .next/standalone/. deploy-release/

          if [ -d public ]; then
            cp -a public deploy-release/public
          fi

          mkdir -p deploy-release/.next
          cp -a .next/static deploy-release/.next/static

          test -f deploy-release/server.js
          test -d deploy-release/.next/static

          tar -czf "$GITHUB_WORKSPACE/frontend-release.tar.gz" \
            -C deploy-release .

          test -s "$GITHUB_WORKSPACE/frontend-release.tar.gz"

      # ------------------------------------------------------------
      # BACKEND
      # ------------------------------------------------------------

      - name: Install and build backend
        working-directory: backend
        env:
          DATABASE_URL: mysql://build_user:build_password@127.0.0.1:3306/build_database
        run: |
          set -Eeuo pipefail

          npm config set registry https://registry.npmjs.org/
          npm ci --include=dev --no-audit --no-fund

          npm run prisma:generate
          npm run typecheck
          npm run build

          test -f app.js
          test -f package.json
          test -f package-lock.json
          test -f prisma.config.ts
          test -f prisma/schema.prisma
          test -f dist/src/server.js
          test -f dist/src/scripts/migrate-production.js

      - name: Prepare backend release archive
        working-directory: backend
        run: |
          set -Eeuo pipefail

          tar -czf "$GITHUB_WORKSPACE/backend-release.tar.gz" \
            app.js \
            package.json \
            package-lock.json \
            prisma.config.ts \
            dist \
            prisma

          test -s "$GITHUB_WORKSPACE/backend-release.tar.gz"

      # ------------------------------------------------------------
      # BUILD CPANEL RELEASE CONTENT
      # ------------------------------------------------------------

      - name: Prepare cPanel release files
        run: |
          set -Eeuo pipefail

          rm -rf publish
          mkdir -p publish

          cp frontend-release.tar.gz publish/frontend-release.tar.gz
          cp backend-release.tar.gz publish/backend-release.tar.gz

          cp deploy/cpanel/deploy-cpanel.sh \
            publish/deploy-cpanel.sh

          cp deploy/cpanel/gateway-server.cjs \
            publish/gateway-server.cjs

          cp deploy/cpanel/sicko-release-watch.sh \
            publish/sicko-release-watch.sh

          printf '%s\n' "$GITHUB_SHA" \
            > publish/source-commit.txt

          cat > publish/.cpanel.yml <<'YAML'
          ---
          deployment:
            tasks:
              - /bin/bash /home/sickosou/repositories/Sicko-Soul-Website/deploy-cpanel.sh
          YAML

          test -f publish/.cpanel.yml
          test -f publish/deploy-cpanel.sh
          test -f publish/frontend-release.tar.gz
          test -f publish/backend-release.tar.gz

      # ------------------------------------------------------------
      # PUBLISH cpanel-release
      #
      # IMPORTANT:
      # Do NOT force-push this branch anymore.
      # cPanel updates the cloned repository using fast-forward updates.
      # ------------------------------------------------------------

      - name: Publish cpanel-release branch
        run: |
          set -Eeuo pipefail

          git config user.name "Sicko Soul Deploy"
          git config user.email "deploy@sickosoul.shop"

          git fetch origin \
            "${CPANEL_RELEASE_BRANCH}:refs/remotes/origin/${CPANEL_RELEASE_BRANCH}"

          rm -rf release-worktree

          git worktree add \
            -B "${CPANEL_RELEASE_BRANCH}" \
            release-worktree \
            "origin/${CPANEL_RELEASE_BRANCH}"

          find release-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            -exec rm -rf {} +

          cp -a publish/. release-worktree/

          cd release-worktree

          git add -A

          if git diff --cached --quiet; then
            echo "Release contents are unchanged."
          else
            git commit -m "Production release ${GITHUB_SHA}"
            git push origin "${CPANEL_RELEASE_BRANCH}"
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"

          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"

          echo "Published cPanel release:"
          echo "${RELEASE_SHA}"

      # ------------------------------------------------------------
      # ASK CPANEL TO PULL cpanel-release FROM GITHUB
      # ------------------------------------------------------------

      - name: Update cPanel repository from GitHub
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -z "${CPANEL_API_TOKEN:-}" ]; then
            echo "CPANEL_API_TOKEN secret is missing."
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 3 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            --data-urlencode "branch=${CPANEL_RELEASE_BRANCH}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update" \
            -o cpanel-update.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("cpanel-update.json").read_text()
          )

          result = data.get("result", {})

          if result.get("status") != 1:
              raise SystemExit(
                  "cPanel repository update failed: "
                  + json.dumps(
                      {
                          "errors": result.get("errors"),
                          "warnings": result.get("warnings"),
                          "messages": result.get("messages"),
                      },
                      ensure_ascii=False,
                  )
              )

          print("cPanel accepted repository update.")
          PY

      # ------------------------------------------------------------
      # WAIT UNTIL CPANEL'S LOCAL REPOSITORY HAS THE EXACT RELEASE
      # ------------------------------------------------------------

      - name: Wait for cPanel repository synchronization
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 18); do
            echo "Checking repository synchronization (${attempt}/18)..."

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 15 \
              --max-time 60 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/VersionControl/retrieve" \
              -o cpanel-repositories.json

            if python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          expected_root = os.environ["CPANEL_REPOSITORY_ROOT"]
          expected_sha = os.environ["RELEASE_SHA"]

          payload = json.loads(
              Path("cpanel-repositories.json").read_text()
          )

          result = payload.get("result", {})

          if result.get("status") != 1:
              print(
                  "Repository status query failed:",
                  result.get("errors"),
              )
              sys.exit(1)

          repositories = result.get("data") or []

          if isinstance(repositories, dict):
              repositories = [repositories]

          repository = next(
              (
                  item
                  for item in repositories
                  if item.get("repository_root") == expected_root
              ),
              None,
          )

          if not repository:
              print("cPanel repository was not found yet.")
              sys.exit(1)

          last_update = repository.get("last_update") or {}

          current_sha = (
              last_update.get("identifier")
              or repository.get("identifier")
              or ""
          )

          print("Expected release:", expected_sha)
          print("cPanel release:  ", current_sha or "not available yet")

          if current_sha != expected_sha:
              sys.exit(1)

          print("cPanel repository is synchronized.")
          PY
            then
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for cPanel to update to ${RELEASE_SHA}."
          exit 1

      # ------------------------------------------------------------
      # DEPLOY THE SYNCHRONIZED HEAD
      # ------------------------------------------------------------

      - name: Trigger cPanel deployment
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --connect-timeout 15 \
            --max-time 60 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" \
            -o cpanel-deploy.json

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("cpanel-deploy.json").read_text()
          )

          result = data.get("result", {})

          if result.get("status") != 1:
              raise SystemExit(
                  "cPanel deployment could not be queued: "
                  + json.dumps(
                      {
                          "errors": result.get("errors"),
                          "warnings": result.get("warnings"),
                          "messages": result.get("messages"),
                      },
                      ensure_ascii=False,
                  )
              )

          details = result.get("data") or {}

          deploy_id = str(details.get("deploy_id") or "")
          task_id = str(details.get("task_id") or "")
          log_path = str(details.get("log_path") or "")

          if not deploy_id:
              raise SystemExit(
                  "cPanel returned success but no deploy_id."
              )

          env_file = Path(os.environ["GITHUB_ENV"])

          with env_file.open("a") as fh:
              fh.write(f"CPANEL_DEPLOY_ID={deploy_id}\n")

          print("cPanel deployment queued.")
          print("Deploy ID:", deploy_id)

          if task_id:
              print("Task ID:", task_id)

          if log_path:
              print("Server deployment log:", log_path)
          PY

      # ------------------------------------------------------------
      # WAIT FOR CPANEL DEPLOYMENT TO ACTUALLY FINISH
      # ------------------------------------------------------------

      - name: Wait for cPanel deployment
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 36); do
            echo "Checking deployment (${attempt}/36)..."

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 15 \
              --max-time 60 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/retrieve" \
              -o cpanel-deployments.json

            STATUS="$(
              python3 <<'PY'
          import json
          import os
          from pathlib import Path

          deploy_id = str(os.environ["CPANEL_DEPLOY_ID"])

          payload = json.loads(
              Path("cpanel-deployments.json").read_text()
          )

          result = payload.get("result", {})

          if result.get("status") != 1:
              print("query-error")
              raise SystemExit

          deployments = result.get("data") or []

          if isinstance(deployments, dict):
              deployments = [deployments]

          deployment = next(
              (
                  item
                  for item in deployments
                  if str(item.get("deploy_id")) == deploy_id
              ),
              None,
          )

          if not deployment:
              print("waiting")
              raise SystemExit

          timestamps = deployment.get("timestamps") or {}

          if timestamps.get("succeeded"):
              print("succeeded")
          elif timestamps.get("failed"):
              print("failed")
          elif timestamps.get("canceled"):
              print("canceled")
          else:
              print("waiting")
          PY
            )"

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              succeeded)
                echo "cPanel deployment completed successfully."
                exit 0
                ;;

              failed|canceled)
                echo "cPanel deployment ${STATUS}."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for cPanel deployment."
          exit 1

      # ------------------------------------------------------------
      # PRODUCTION HEALTH CHECK
      # ------------------------------------------------------------

      - name: Verify production
        run: |
          set -Eeuo pipefail

          echo "Waiting for Passenger applications..."

          sleep 5

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            https://sickosoul.shop/__sicko_gateway_health \
            -o gateway-health.json

          cat gateway-health.json
          echo

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("gateway-health.json").read_text()
          )

          if data.get("status") != "ok":
              raise SystemExit("Gateway health status is not OK.")

          if data.get("frontend") is not True:
              raise SystemExit("Frontend health check failed.")

          if data.get("backend") is not True:
              raise SystemExit("Backend health check failed.")

          print("Gateway, frontend and backend are healthy.")
          PY

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 6 \
            --retry-delay 5 \
            --retry-all-errors \
            https://sickosoul.shop/api/v1/health \
            -o api-health.json

          cat api-health.json
          echo

          python3 <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("api-health.json").read_text()
          )

          data = payload.get("data", {})

          if data.get("status") != "ok":
              raise SystemExit("Backend status is not OK.")

          if data.get("database") != "connected":
              raise SystemExit("Production database is not connected.")

          print("Production API and database are healthy.")
          PY

      - name: Deployment summary
        run: |
          {
            echo "## Sicko Soul production deployment"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Release commit: \`${RELEASE_SHA}\`"
            echo "- cPanel deployment ID: \`${CPANEL_DEPLOY_ID}\`"
            echo "- Production: https://sickosoul.shop"
            echo "- Result: ✅ deployed and health checked"
          } >> "$GITHUB_STEP_SUMMARY"