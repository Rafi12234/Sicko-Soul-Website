name: Build and release Sicko Soul

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sicko-soul-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  CPANEL_RELEASE_BRANCH: cpanel-release

jobs:
  build-release:
    name: Test and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # CHECKOUT + NODE
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Validate staging, promotion, failure recovery and gateway runtime SHA
      # locally before building a deployable release (no real DB is touched).
      - name: Verify safe deployment and rollback simulations
        run: node --test tests/safe-deploy.test.mjs

      # ============================================================
      # FRONTEND
      # ============================================================

      - name: Install and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -Eeuo pipefail

          npm config set registry https://registry.npmjs.org/

          npm ci --include=dev --no-audit --no-fund

          npm run typecheck
          npm run build
          # Future frontend tests can expose test:ci in frontend/package.json.
          npm run test:ci --if-present

          test -f .next/standalone/server.js
          test -d .next/static

      - name: Prepare frontend release archive
        working-directory: frontend
        run: |
          set -Eeuo pipefail

          rm -rf deploy-release
          mkdir -p deploy-release

          cp -a .next/standalone/. deploy-release/

          if [ -d public ]; then
            cp -a public deploy-release/public
          fi

          mkdir -p deploy-release/.next

          cp -a .next/static deploy-release/.next/static

          test -f deploy-release/server.js
          test -d deploy-release/.next/static

          tar -czf "$GITHUB_WORKSPACE/frontend-release.tar.gz" \
            -C deploy-release .

          test -s "$GITHUB_WORKSPACE/frontend-release.tar.gz"

      # ============================================================
      # BACKEND
      # ============================================================

      - name: Install and build backend
        working-directory: backend
        env:
          DATABASE_URL: mysql://build_user:build_password@127.0.0.1:3306/build_database
        run: |
          set -Eeuo pipefail

          npm config set registry https://registry.npmjs.org/

          npm ci --include=dev --no-audit --no-fund

          npm run prisma:generate
          npm run typecheck
          npm run build

          test -f app.js
          test -f package.json
          test -f package-lock.json
          test -f prisma.config.ts
          test -f prisma/schema.prisma
          test -f dist/src/server.js
          test -f dist/src/scripts/migrate-production.js

      # Stable test-discovery entrypoint. New *-static.test.mjs or
      # *-security.test.mjs files are picked up without editing this workflow.
      - name: Run all backend CI static and security tests
        working-directory: backend
        run: npm run test:ci

      # TEMPORARY: staging E2E tests run only when explicitly enabled in GitHub Variables.
      # This does not disable compilation or P0/P1 static security checks.
      - name: Notice - staging E2E checks skipped
        if: ${{ vars.RUN_STAGING_TESTS != 'true' }}
        run: |
          echo "::warning::P0/P1 staging E2E checks skipped for this release. Do not treat this as a staging security sign-off."

      - name: Run required P0 staging workflow tests
        if: ${{ vars.RUN_STAGING_TESTS == 'true' }}
        working-directory: backend
        env:
          P0_STAGING_ALLOW_WRITE: "true"
          P0_STAGING_API_URL: ${{ secrets.P0_STAGING_API_URL }}
          P0_STAGING_PRODUCT_ID: ${{ vars.P0_STAGING_PRODUCT_ID }}
          P0_STAGING_VARIANT_ID: ${{ vars.P0_STAGING_VARIANT_ID }}
          P0_STAGING_CUSTOMER_EMAIL: ${{ secrets.P0_STAGING_CUSTOMER_EMAIL }}
          P0_STAGING_CUSTOMER_PHONE: ${{ secrets.P0_STAGING_CUSTOMER_PHONE }}
          P0_STAGING_ADMIN_EMAIL: ${{ secrets.P0_STAGING_ADMIN_EMAIL }}
          P0_STAGING_ADMIN_PASSWORD: ${{ secrets.P0_STAGING_ADMIN_PASSWORD }}
        run: npm run test:p0:staging

      - name: Run P1 staging commerce, shipment, review and staff-role tests
        if: ${{ vars.RUN_STAGING_TESTS == 'true' }}
        working-directory: backend
        env:
          P1_STAGING_ALLOW_WRITE: "true"
          P1_STAGING_API_URL: ${{ secrets.P0_STAGING_API_URL }}
          P1_STAGING_PRODUCT_ID: ${{ vars.P0_STAGING_PRODUCT_ID }}
          P1_STAGING_VARIANT_ID: ${{ vars.P0_STAGING_VARIANT_ID }}
          P1_STAGING_CUSTOMER_EMAIL: ${{ secrets.P0_STAGING_CUSTOMER_EMAIL }}
          P1_STAGING_CUSTOMER_PHONE: ${{ secrets.P0_STAGING_CUSTOMER_PHONE }}
          P1_STAGING_ADMIN_EMAIL: ${{ secrets.P0_STAGING_ADMIN_EMAIL }}
          P1_STAGING_ADMIN_PASSWORD: ${{ secrets.P0_STAGING_ADMIN_PASSWORD }}
          P1_STAGING_SUPPORT_EMAIL: ${{ secrets.P1_STAGING_SUPPORT_EMAIL }}
          P1_STAGING_SUPPORT_PASSWORD: ${{ secrets.P1_STAGING_SUPPORT_PASSWORD }}
          P1_STAGING_ORDER_MANAGER_EMAIL: ${{ secrets.P1_STAGING_ORDER_MANAGER_EMAIL }}
          P1_STAGING_ORDER_MANAGER_PASSWORD: ${{ secrets.P1_STAGING_ORDER_MANAGER_PASSWORD }}
          P1_STAGING_INVENTORY_MANAGER_EMAIL: ${{ secrets.P1_STAGING_INVENTORY_MANAGER_EMAIL }}
          P1_STAGING_INVENTORY_MANAGER_PASSWORD: ${{ secrets.P1_STAGING_INVENTORY_MANAGER_PASSWORD }}
          P1_STAGING_TEST_INBOX_URL: ${{ secrets.P1_STAGING_TEST_INBOX_URL }}
          P1_STAGING_TEST_INBOX_BEARER: ${{ secrets.P1_STAGING_TEST_INBOX_BEARER }}
        run: npm run test:p1:staging

      - name: Prepare backend release archive
        working-directory: backend
        run: |
          set -Eeuo pipefail

          tar -czf "$GITHUB_WORKSPACE/backend-release.tar.gz" \
            app.js \
            package.json \
            package-lock.json \
            prisma.config.ts \
            dist \
            prisma

          test -s "$GITHUB_WORKSPACE/backend-release.tar.gz"

      # ============================================================
      # CREATE CPANEL RELEASE CONTENT
      # ============================================================

      - name: Prepare cPanel release files
        run: |
          set -Eeuo pipefail

          rm -rf publish
          mkdir -p publish

          cp frontend-release.tar.gz \
            publish/frontend-release.tar.gz

          cp backend-release.tar.gz \
            publish/backend-release.tar.gz

          cp deploy/cpanel/deploy-cpanel.sh \
            publish/deploy-cpanel.sh

          cp deploy/cpanel/gateway-server.cjs \
            publish/gateway-server.cjs

          cp deploy/cpanel/sicko-release-watch.sh \
            publish/sicko-release-watch.sh

          printf '%s\n' "$GITHUB_SHA" \
            > publish/source-commit.txt

          cat > publish/.cpanel.yml <<'YAML'
          ---
          deployment:
            tasks:
              - /bin/bash /home/sickosou/repositories/Sicko-Soul-Website/deploy-cpanel.sh
          YAML

          test -f publish/.cpanel.yml
          test -f publish/deploy-cpanel.sh
          test -f publish/gateway-server.cjs
          test -f publish/sicko-release-watch.sh
          test -f publish/source-commit.txt
          test -s publish/frontend-release.tar.gz
          test -s publish/backend-release.tar.gz

      # ============================================================
      # UPDATE cpanel-release BRANCH
      #
      # IMPORTANT:
      # Keep this branch fast-forwardable.
      # Do NOT force-push it anymore.
      # ============================================================

      - name: Publish cpanel-release branch
        run: |
          set -Eeuo pipefail

          git config user.name "Sicko Soul Deploy"
          git config user.email "deploy@sickosoul.shop"

          git fetch origin \
            "${CPANEL_RELEASE_BRANCH}:refs/remotes/origin/${CPANEL_RELEASE_BRANCH}"

          rm -rf release-worktree

          git worktree add \
            -B "${CPANEL_RELEASE_BRANCH}" \
            release-worktree \
            "origin/${CPANEL_RELEASE_BRANCH}"

          find release-worktree \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            -exec rm -rf {} +

          cp -a publish/. release-worktree/

          cd release-worktree

          git add -A

          if git diff --cached --quiet; then
            echo "Release contents are unchanged."
          else
            git commit \
              -m "Production release ${GITHUB_SHA}"

            git push \
              origin \
              "${CPANEL_RELEASE_BRANCH}"
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"

          echo "RELEASE_SHA=${RELEASE_SHA}" \
            >> "$GITHUB_ENV"

          echo "Published release commit:"
          echo "$RELEASE_SHA"


      # ============================================================
      # MANUAL HOSTING DEPLOYMENT ONLY
      #
      # This workflow deliberately STOPS after publishing cpanel-release.
      # It must never POST to the website deployment webhook.
      # Operator executes sicko-release-watch.sh in cPanel Terminal
      # only after reviewing the prepared release and manual DB SQL.
      # ============================================================

      - name: Manual hosting deployment instructions
        run: |
          {
            echo "## Sicko Soul Release Prepared (NOT DEPLOYED)"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Release commit: ${RELEASE_SHA}"
            echo "- Hosting has NOT been updated by this workflow."
            echo
            echo "### Deploy manually when ready"
            echo "In cPanel Terminal, run:"
            echo "bash"
            echo "bash /home/sickosou/repositories/Sicko-Soul-Website/sicko-release-watch.sh"
            echo ""
            echo
            echo "This fetches the latest cpanel-release, stages builds,"
            echo "performs read-only database schema checks and health checks,"
            echo "and activates the release. Apply any required SQL yourself"
            echo "through phpMyAdmin BEFORE running the command."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-cpanel:
    name: Activate tested release using cPanel UAPI
    needs: build-release
    # Deliberately OFF until a manual release using this optimized script passes
    # on the actual 100-NPROC account. No variable = no production change.
    if: ${{ github.event_name == 'push' && vars.SICKO_AUTODEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Check published release and deploy through cPanel
        shell: bash
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_UAPI_TOKEN: ${{ secrets.CPANEL_UAPI_TOKEN }}
          EXPECTED_SOURCE: ${{ github.sha }}
          REPO_ROOT: /home/sickosou/repositories/Sicko-Soul-Website
        run: |
          set -Eeuo pipefail
          test -n "${CPANEL_HOST:-}" && test -n "${CPANEL_UAPI_TOKEN:-}"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          api() {
            local endpoint="$1"
            shift
            local http
            http="$(curl --silent --show-error --connect-timeout 10 --max-time 90 \
              --get "https://${CPANEL_HOST}:2083/execute/${endpoint}" \
              --header "Authorization: cpanel sickosou:${CPANEL_UAPI_TOKEN}" \
              --header 'Accept: application/json' \
              "$@" --output "$response" --write-out '%{http_code}')"
            echo "${endpoint}: HTTP ${http}"
            test "$http" = "200"
            if ! jq -e '.status == 1 and ((.errors // []) | length == 0)' "$response" >/dev/null; then
              jq -c '{status,errors,messages}' "$response"
              exit 1
            fi
          }

          actual_source="$(curl -fsSL --connect-timeout 10 --max-time 25 \
            'https://raw.githubusercontent.com/Rafi12234/Sicko-Soul-Website/cpanel-release/source-commit.txt' \
            | tr -d '\r\n')"
          [[ "$actual_source" == "$EXPECTED_SOURCE" ]] || {
            echo "Release branch does not match this build. Refusing to deploy."
            exit 1
          }

          api VersionControl/retrieve
          repo_entry="$(jq -c --arg root "$REPO_ROOT" \
            '.data[] | select(.repository_root == $root)' "$response")"
          [[ -n "$repo_entry" ]]
          [[ "$(jq -r '.branch' <<< "$repo_entry")" == "cpanel-release" ]]
          [[ "$(jq -r '.deployable' <<< "$repo_entry")" == "1" ]]
          repo_name="$(jq -r '.name // empty' <<< "$repo_entry")"
          [[ -n "$repo_name" ]]

          api VersionControl/update \
            --data-urlencode "name=${repo_name}" \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            --data-urlencode "branch=cpanel-release" \
            --data-urlencode 'source_repository={"remote_name":"origin"}'

          api VersionControl/retrieve
          checked_out_sha="$(jq -r --arg root "$REPO_ROOT" \
            '.data[] | select(.repository_root == $root) | .last_update.identifier // empty' \
            "$response")"
          published_sha="$(curl -fsSL --connect-timeout 10 --max-time 25 \
            'https://api.github.com/repos/Rafi12234/Sicko-Soul-Website/commits/cpanel-release' \
            | jq -r '.sha')"
          [[ -n "$checked_out_sha" && "$checked_out_sha" == "$published_sha" ]] || {
            echo "cPanel checkout is not the published release. Refusing to deploy."
            exit 1
          }

          api VersionControlDeployment/create \
            --data-urlencode "repository_root=${REPO_ROOT}"
          echo "cPanel accepted deployment; verifying the running release..."

          for i in $(seq 1 100); do
            health="$(curl -fsS --connect-timeout 5 --max-time 10 \
              'https://sickosoul.shop/__sicko_gateway_health' 2>/dev/null || true)"
            if jq -e --arg sha "$EXPECTED_SOURCE" \
              '.status == "ok" and .frontend == true and .backend == true and .runtimeSource == $sha' \
              <<< "$health" >/dev/null 2>&1; then
              curl -fsS --connect-timeout 5 --max-time 10 \
                'https://sickosoul.shop/api/v1/health' >/dev/null
              curl -fsS --connect-timeout 5 --max-time 10 \
                'https://sickosoul.shop/' >/dev/null
              echo "PASS: Verified the new release is serving production."
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: cPanel activation did not verify the intended source."
          echo "Inspect the cPanel deployment log; do not mark deployment successful."
          exit 1
